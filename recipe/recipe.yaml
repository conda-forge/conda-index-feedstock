schema_version: 1

context:
  name: conda-index
  version: "0.13.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/conda/${{ name }}/archive/refs/tags/${{ version }}.tar.gz
  sha256: ac9207651788bd5ca557f24328701d4ec71712dea0e758c73fc7100b5cd9dc55

build:
  number: 0
  noarch: python
  script:
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{ version }}
    content: ${{ PYTHON }} -m pip install --no-build-isolation . -vv

requirements:
  host:
    - hatchling >=1.12.2
    - hatch-vcs >=0.2.0
    - python ${{ python_min }}.*
    - pip
  run:
    - python >=${{ python_min }}
    - conda >=25
    - conda-package-streaming >=0.12.0
    - jinja2
    - msgpack-python >=1.1.1
    - ruamel.yaml
    - zstandard

tests:
  - python:
      imports:
        - conda_index.index
      pip_check: false
      python_version:
        - ${{ python_min }}.*
        - "*"
  - files:
      source:
        - tests
    requirements:
      run:
        - conda-build >=25
        - conda-package-handling >=2.2.0
        - coverage
        - fsspec
        - pytest >=7
        - pytest-cov
        - pytest-mock
        - python ${{ python_min }}.*
    script:
      - pytest -k test_index_on_single_subdir_1

about:
  summary: Create `repodata.json` for collections of conda packages.
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/conda/conda-index
  repository: https://github.com/conda/conda-index
  documentation: https://conda.github.io/conda-index

extra:
  recipe-maintainers:
    - kenodegard
    - AndresGuzman-Ballen
    - dholth
    - jharlow-intel
